<div class="container d-flex flex-column align-items-center justify-content-center p-5">

  <h5>Log In</h5>
  <small class="text-muted">Effettua il log in usando le credenziali con cui hai effettuato il Sign Up</small>

  <form class="w-100 mt-4" style="max-width: 500px;" [formGroup]="loginForm" (ngSubmit)="handleLogIn()">

    <div class="form-group row p-3 align-items-center">
      <label for="email" class="col-sm-4 col-form-label text-start">Email:</label>
      <div class="col-sm-8">
        <input id="email" formControlName="email" type="email" class="form-control" placeholder="email@provider.it" (focus)="emailSelected()" />
      </div>
    </div>

    <div class="form-group row p-3 align-items-center" >
      <label for="pwd" class="col-sm-4 col-form-label text-start">Password:</label>
      <div class="col-sm-8">
        <input [type]="showPwd ? 'text' : 'password'" id="pwd" formControlName="pwd" class="form-control" placeholder="••••••••" (focus)="pwdSelected()"/>
        <div class="form-check mt-1">
          <input type="checkbox" class="form-check-input" id="showPwd" (change)="showPwd = !showPwd">
          <label class="form-check-label small" for="showPwd">Mostra password</label>
        </div>
    </div>

    @if(emailSelect && pwdSelect && loginForm.invalid){ 
      <div class="alert alert-danger text-start">
        Compila tutti i campi per continuare.
      </div>
    }

    <div class="text-center">
      <button id="login-btn" type="submit" class="btn btn-primary text-white mt-3" [disabled]=loginForm.invalid >Log in</button>
    </div>



</div>
