<div class="container d-flex flex-column align-items-center justify-content-center p-5">
  <form class="w-100" style="max-width: 500px;" [formGroup]="signupForm" (ngSubmit)="handleSignUp()">
    <div class="form-group row p-3 align-items-center">
      <label for="name" class="col-sm-4 col-form-label text-start">Nome:</label>
      <div class="col-sm-8">
        <input id="name" formControlName="name" type="text" class="form-control" placeholder="Nome"/>
      </div>
    </div>
    <div class="form-group row p-3 align-items-center">
      <label for="email" class="col-sm-4 col-form-label text-start">Email:</label>
      <div class="col-sm-8">
        <input id="email" formControlName="email" type="email" class="form-control" placeholder="email@provider.it"/>
      </div>
    </div>
    <div class="form-group row p-3 align-items-center">
      <label for="pwd" class="col-sm-4 col-form-label text-start">Password:</label>
      <div class="col-sm-8">
        <input id="pwd" formControlName="pwd" type="password" class="form-control" placeholder="••••••••"/>
      </div>
    </div>
    @if(submitted && signupForm.invalid){ 
      <div class="alert alert-danger text-start">
        Compila correttamente tutti i campi per continuare.
      </div>
    }
    <div class="text-center">
      <button type="submit" class="btn btn-primary text-white mt-3">Sign Up</button>
    </div>
  </form>
</div>
